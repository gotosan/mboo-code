name: Windows Desktop

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            mboo-web/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: mboo-web
      - run: npm run package:win:x64
        working-directory: desktop
        env:
          MBOO_SIGNING_MODE: unsigned
      - shell: pwsh
        run: ./desktop/scripts/windows-unpacked-smoke.ps1
      - shell: pwsh
        run: |
          $installer = (Get-ChildItem ./desktop/release/Mboo-Code-*-win-x64.exe | Select-Object -First 1).FullName
          ./desktop/scripts/windows-installer-smoke.ps1 -InstallerPath $installer
      - uses: actions/upload-artifact@v4
        with:
          name: mboo-code-windows-x64
          path: |
            desktop/release/Mboo-Code-*-win-x64.exe
            desktop/release/Mboo-Code-*-win-x64.exe.blockmap
