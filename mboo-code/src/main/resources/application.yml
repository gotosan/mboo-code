spring:
  application:
    name: mboo-code
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${user.home}/.mboo/mboo_data.sqlite
  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite/schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# springdoc-openapi项目配置
springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yu.mboocode
knife4j:
  enable: true
  setting:
    language: zh_cn
